; Pool dimensionne pour une instance a 2 Go de RAM
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Les logs partent sur la sortie standard du conteneur
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
clear_env = no
