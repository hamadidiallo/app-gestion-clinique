; Pool dimensionne pour un serveur de 2 Go partage avec Dukani : le conteneur
; est plafonne a 512 Mo (deploy/compose.yaml), soit 6 processus d'environ 60 Mo
; avec de la marge pour OPcache.
[www]
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Les logs partent sur la sortie standard du conteneur
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
clear_env = no
