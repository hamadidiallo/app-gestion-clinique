# =============================================================================
# Pile de production — medigest.dukani.tech
#
# MediGest est hébergé sur le serveur de Dukani (EC2 13.49.80.9, 2 Go de RAM)
# et s'appuie sur ce qui y tourne déjà :
#   - la base est dans le PostgreSQL de Dukani (conteneur dukani_postgres),
#     avec un utilisateur et une base « medigest » qui n'ont pas accès à Dukani ;
#   - le TLS est terminé par le Caddy de Dukani, qui transmet
#     medigest.dukani.tech à medigest-web (voir LISEZMOI-deploiement.md).
# Aucun port n'est donc publié ici, et il n'y a pas de conteneur de base.
#
# L'image applicative est construite sur le poste de développement puis chargée
# sur l'instance : compiler les extensions PHP et les assets sur le serveur
# serait lent et pourrait manquer de mémoire.
#
# Les services portent le préfixe « medigest- » car ils rejoignent le réseau de
# Dukani : un nom générique comme « app » pourrait y entrer en collision.
# =============================================================================

services:
  medigest-web:
    image: caddy:2-alpine
    container_name: medigest_web
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Même chemin que dans le conteneur applicatif : php-fpm doit retrouver
      # les fichiers à l'emplacement annoncé par Caddy.
      - public_assets:/var/www/html/public:ro
      - caddy_config:/config
    depends_on:
      - medigest-app
    mem_limit: 64m
    networks:
      - interne
      - dukani

  medigest-app:
    image: medigest-app:latest
    container_name: medigest_app
    restart: unless-stopped
    env_file: .env
    environment:
      # Seul ce conteneur applique les migrations, pour éviter que le worker
      # ne les exécute en parallèle au démarrage.
      RUN_MIGRATIONS: "true"
    volumes:
      - public_assets:/var/www/html/public
      - storage_data:/var/www/html/storage
    # Plafond pour qu'un emballement de MediGest ne prive pas Dukani de mémoire
    mem_limit: 512m
    networks:
      - interne
      - dukani

  medigest-queue:
    image: medigest-app:latest
    container_name: medigest_queue
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    # --max-time recycle le worker toutes les heures : le code étant mis en
    # cache par OPcache, un worker de longue durée garderait l'ancien code.
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - medigest-app
    mem_limit: 256m
    networks:
      - dukani

networks:
  # Entre le Caddy de MediGest et php-fpm
  interne:
    driver: bridge
  # Réseau du compose Dukani : accès à dukani_postgres, et point d'entrée
  # du Caddy de Dukani vers medigest-web
  dukani:
    external: true
    name: dukani_default

volumes:
  public_assets:
  storage_data:
  caddy_config:
