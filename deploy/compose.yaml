# =============================================================================
# Pile de production — medigest.dukani.tech
#
# L'image applicative est construite sur le poste de développement puis chargée
# sur l'instance : avec 2 Go de RAM, compiler les extensions PHP et les assets
# sur le serveur serait lent et exposerait à un échec par manque de mémoire.
# =============================================================================

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Même chemin que dans le conteneur applicatif : php-fpm doit retrouver
      # les fichiers à l'emplacement annoncé par Caddy.
      - public_assets:/var/www/html/public:ro
      # Certificats et clés de compte ACME : à conserver entre deux déploiements
      # sous peine de réémettre un certificat à chaque redémarrage.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - interne

  app:
    image: medigest-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Seul ce conteneur applique les migrations, pour éviter que le worker
      # ne les exécute en parallèle au démarrage.
      RUN_MIGRATIONS: "true"
    volumes:
      - public_assets:/var/www/html/public
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interne

  queue:
    image: medigest-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    # --max-time recycle le worker toutes les heures : le code étant mis en
    # cache par OPcache, un worker de longue durée garderait l'ancien code.
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - interne

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    # Dimensionnement pour une instance à 2 Go : la valeur par défaut du buffer
    # pool laisserait trop peu de mémoire à PHP.
    command: >
      --innodb-buffer-pool-size=192M
      --max-connections=60
      --performance-schema=OFF
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - interne

networks:
  interne:
    driver: bridge

volumes:
  public_assets:
  storage_data:
  db_data:
  caddy_data:
  caddy_config:
